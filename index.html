<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Wealth DNA — Your Financial Life Blueprint</title>
    <meta
      name="description"
      content="Wealth DNA connects your goals, investments, insurance, loans and emergency funds into one interactive blueprint — with a live node graph, milestone timeline and premium FinTech dashboard."
    />
    <meta
      name="keywords"
      content="Wealth DNA, personal finance, financial planning, net worth, financial goals, investments, insurance, node graph, milestone timeline, FinTech dashboard"
    />
    <meta name="author" content="Wealth DNA" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Icons (PWA manifest + apple-touch injected/served from /public) -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Canonical: update the origin to your live deployment URL. -->
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wealth DNA" />
    <meta property="og:title" content="Wealth DNA — Your Financial Life Blueprint" />
    <meta
      property="og:description"
      content="See your entire financial ecosystem as one living, interactive blueprint — goals, investments, loans, insurance and emergency funds, connected."
    />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wealth DNA — Your Financial Life Blueprint" />
    <meta
      name="twitter:description"
      content="See your entire financial ecosystem as one living, interactive blueprint — goals, investments, loans, insurance and emergency funds, connected."
    />
    <meta name="twitter:image" content="./og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Wealth DNA",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any (web browser)",
        "description": "A personal finance platform that visualizes your complete financial ecosystem — goals, investments, insurance, loans and emergency funds — as an interactive blueprint.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
      }
    </script>

    <!--
      Inline, render-blocking theme bootstrap.
      Applies the saved theme mode BEFORE first paint to avoid a flash of the
      wrong theme (FOUC). Reads the same localStorage key the Zustand store uses.
    -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('wealthdna-theme')
          var mode = raw ? JSON.parse(raw)?.state?.mode : 'system'
          if (mode === 'system' || !mode) {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = mode
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
