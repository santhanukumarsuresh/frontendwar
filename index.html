<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Frontend Wars 2026 — Client-side React Starter</title>
    <meta
      name="description"
      content="A fully client-side React + TypeScript + Vite + Tailwind app built for Frontend Wars 2026: token-driven theming, data visualization, 3D, PWA and offline support."
    />
    <meta
      name="keywords"
      content="Frontend Wars 2026, React, TypeScript, Vite, Tailwind CSS, PWA, data visualization, Three.js"
    />
    <meta name="author" content="Frontend Wars 2026 participant" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- Icons (PWA manifest + apple-touch injected/served from /public) -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Canonical: update the origin to your live deployment URL. -->
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Frontend Wars 2026" />
    <meta property="og:title" content="Frontend Wars 2026 — Client-side React Starter" />
    <meta
      property="og:description"
      content="Token-driven theming, data viz, 3D, PWA & offline — 100% client-side React + TypeScript + Vite + Tailwind."
    />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Frontend Wars 2026 — Client-side React Starter" />
    <meta
      name="twitter:description"
      content="Token-driven theming, data viz, 3D, PWA & offline — 100% client-side React + TypeScript + Vite + Tailwind."
    />
    <meta name="twitter:image" content="./og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Frontend Wars 2026",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any (web browser)",
        "description": "A fully client-side React + TypeScript + Vite + Tailwind app built for Frontend Wars 2026.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!--
      Inline, render-blocking theme bootstrap.
      Applies the saved theme mode BEFORE first paint to avoid a flash of the
      wrong theme (FOUC). Reads the same localStorage key the Zustand store uses.
    -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('fw-theme')
          var mode = raw ? JSON.parse(raw)?.state?.mode : 'system'
          if (mode === 'system' || !mode) {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = mode
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
